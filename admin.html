<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli | İHSAN MOBİLYA</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        // High-level Auth & Auto-Login Check
        (function() {
            const params = new URLSearchParams(window.location.search);
            // Case 1: Auto-login flag from launcher
            if (params.get('auto') === '1') {
                localStorage.setItem('isLoggedIn', 'true');
            }
            
            // Case 2: Regular auth check
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'login.html';
            }
        })();
    </script>
    <style>
        body { background: #0a0a0a; }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .tab-btn { 
            padding: 0.8rem 1.5rem; 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border); 
            color: #fff; 
            cursor: pointer;
            border-radius: 4px;
        }
        .tab-btn.active { 
            background: var(--accent-color); 
            color: #000;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><img src="assets/logo.jpg" alt="İhsan Mobilya Logo" class="logo-img">İHSAN<span>MOBİLYA</span></a>
        <nav>
            <ul>
                <li><a href="index.html">SİTEYE DÖN</a></li>
                <li><button onclick="localStorage.removeItem('isLoggedIn'); window.location.href='index.html';" class="btn" style="padding: 0.5rem 1rem; font-size: 0.8rem; cursor: pointer;">ÇIKIŞ YAP</button></li>
            </ul>
        </nav>
    </header>

    <main class="admin-container">
        <div class="admin-header">
            <div>
                <h1>Yönetim Paneli</h1>
                <p>İhsan Mobilya içerik ve tasarım yönetim merkezi.</p>
            </div>
            <div class="tabs">
                <button class="tab-btn active" onclick="showSection('cat-manage')">Kategoriler & Tasarımlar</button>
                <button class="tab-btn" onclick="showSection('campaigns')">Kampanyalar</button>
                <button class="tab-btn" onclick="showSection('orders')" style="background:#1a436e; border-color:#1a436e;">Siparişler/Mesajlar</button>
            </div>
        </div>

        <!-- Kategoriler & Tasarımlar Bölümü -->
        <div id="cat-manage-section" class="admin-section active">
            <div class="admin-grid">
                <!-- Form Paneli -->
                <div class="admin-form-panel">
                    <h3><span style="font-size: 1.5rem;">📁</span> Yeni Kategori Ekle</h3>
                    <form id="category-form" style="margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--glass-border);">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Kategori Adı</label>
                                <input type="text" id="cat-name" class="admin-input" placeholder="Örn: Mutfak" required>
                            </div>
                            <div class="form-group">
                                <label>İkon (Emoji)</label>
                                <input type="text" id="cat-icon" class="admin-input" placeholder="Örn: 🍳" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Etiket / Slogan</label>
                            <input type="text" id="cat-tag" class="admin-input" placeholder="Örn: Modern & Şık" required>
                        </div>
                        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Kategoriyi Oluştur</button>
                    </form>

                    <h3><span style="font-size: 1.5rem;">🛋️</span> Yeni Tasarım Ekle</h3>
                    <form id="design-form">
                        <div class="form-group">
                            <label>Üst Kategori</label>
                            <select id="parent-category" class="admin-input" required></select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Tasarım Adı</label>
                                <input type="text" id="desc-title" class="admin-input" placeholder="Örn: Lake Ada Mutfak" required>
                            </div>
                            <div class="form-group">
                                 <label>Görsel (Bilgisayardan Seç)</label>
                                 <div class="file-upload-wrapper">
                                     <label for="desc-image-file" class="file-upload-label" id="file-label-text">
                                         <span>📁 Resim Seç veya Sürükle...</span>
                                     </label>
                                     <input type="file" id="desc-image-file" accept="image/*" multiple>
                                     <div id="upload-preview-container" class="upload-preview-grid"></div>
                                     <input type="hidden" id="desc-image-base64">
                                 </div>
                             </div>
                        </div>
                        <div class="form-group">
                            <label>Açıklama</label>
                            <textarea id="desc-text" class="admin-input" rows="3" placeholder="Tasarım detaylarını yazın..." required></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Normal Fiyat</label>
                                <input type="text" id="desc-price" class="admin-input" placeholder="45.000 TL" required>
                            </div>
                            <div class="form-group">
                                <label>İndirimli Fiyat</label>
                                <input type="text" id="desc-discount" class="admin-input" placeholder="38.500 TL">
                            </div>
                        </div>
                        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Tasarımı Kaydet</button>
                    </form>
                </div>

                <!-- Liste Paneli -->
                <div class="admin-list-scroll" id="hierarchical-list">
                    <!-- Kategoriler ve Ürünler buraya yüklenecek -->
                </div>
            </div>
        </div>

        <!-- Kampanyalar Bölümü -->
        <div id="campaigns-section" class="admin-section">
             <div class="admin-grid">
                <div class="admin-form-panel">
                    <h3>Yeni Kampanya Ekle</h3>
                    <form id="campaign-form">
                        <div class="form-group">
                            <label>Kampanya Başlığı</label>
                            <input type="text" id="campaign-title" class="admin-input" required>
                        </div>
                        <div class="form-group">
                            <label>Etiket (Örn: Yeni Sezon)</label>
                            <input type="text" id="campaign-badge" class="admin-input">
                        </div>
                        <div class="form-group">
                            <label>Kampanya Detayı</label>
                            <textarea id="campaign-desc" class="admin-input" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Kampanyayı Yayınla</button>
                    </form>
                </div>
                <div class="admin-list-scroll" id="admin-campaign-list">
                    <!-- Kampanyalar listesi -->
                </div>
             </div>
        </div>

        <!-- Siparişler Bölümü -->
        <div id="orders-section" class="admin-section">
             <div class="admin-grid" style="grid-template-columns: 1fr;">
                <div class="admin-form-panel">
                    <h3 style="color: #6495ED;">Gelen Sipariş ve İletişim Formları</h3>
                    <div id="orders-list" style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
                        <span style="opacity:0.5;">Yükleniyor...</span>
                    </div>
                </div>
             </div>
        </div>
    </main>

    <!-- Düzenleme Modalı -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeEditModal()">&times;</button>
            <h3 id="modal-title">Öğeyi Düzenle</h3>
            <form id="edit-form" style="margin-top: 2rem;">
                <input type="hidden" id="edit-type">
                <input type="hidden" id="edit-cat-id">
                <input type="hidden" id="edit-item-id">
                
                <div id="edit-fields">
                    <!-- Dinamik olarak yüklenecek -->
                </div>
                
                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; margin-top: 2rem;">Değişiklikleri Kaydet</button>
            </form>
        </div>
    </div>

    <script src="catalog-def.js"></script>
    <script src="admin.js"></script>
    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(sectionId + '-section').classList.add('active');
            event.target.classList.add('active');
        }

        async function fetchOrders() {
            try {
                const isLiveServer = window.location.port === '1234';
                const apiUrl = isLiveServer ? 'http://localhost:3000/api/data' : '/api/data';
                const res = await fetch(apiUrl);
                const data = await res.json();
                const list = document.getElementById('orders-list');
                list.innerHTML = '';
                
                if (!data.orders || data.orders.length === 0) {
                    list.innerHTML = '<span style="opacity:0.5;">Henüz hiç sipariş/mesaj gelmemiş.</span>';
                    return;
                }

                data.orders.reverse().forEach(o => {
                    const card = document.createElement('div');
                    card.style = "background:var(--card-bg); padding:1rem; border-radius:8px; border-left:4px solid #6495ED; display:flex; justify-content:space-between; align-items:flex-start;";
                    card.innerHTML = `
                        <div>
                            <h4 style="font-size:1.1rem; margin-bottom:5px;">${o.isim} ${o.soyisim} <span style="font-size:0.8rem; font-weight:normal; opacity:0.6; margin-left:10px;">${o.date || ''}</span></h4>
                            <p style="font-size:0.9rem; opacity:0.8; margin-bottom:5px;">📞 ${o.tel} | ✉️ ${o.email || '-'}</p>
                            <p style="font-size:0.9rem; font-weight:600; color:var(--accent-color);">Not / Model: <span style="color:#fff; font-weight:normal;">${o.not || '-'}</span></p>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch(e) {
                document.getElementById('orders-list').innerHTML = '<span style="color:red;">Veriler yüklenemedi. Server kapalı olabilir.</span>';
            }
        }

        // Initially load orders
        document.addEventListener('DOMContentLoaded', fetchOrders);
    </script>
</body>
</html>
